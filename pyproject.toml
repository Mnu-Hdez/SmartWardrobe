[project]
name = "smart-wardrobe"
version = "0.1.0"
description = "Smart Wardrobe Outfit System - AI-powered outfit recommendation system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "sqlmodel>=0.0.14",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
    "pillow>=10.0.0",
    "colorthief>=0.2.1",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "transformers>=4.36.0",
    "segment-anything>=1.0",
    "open-clip-torch>=2.24.0",
    "httpx>=0.26.0",
    "requests>=2.31.0",
    "alembic>=1.13.0",
    "jinja2>=3.1.0",
    "aiofiles>=23.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]
torch = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "frontend*"]
exclude = ["tests*", "data*", "deploy*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
explicit_package_bases = true