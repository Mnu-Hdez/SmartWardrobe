version: '3.8'

services:
  # -------------------------------------------------
  # Development service with hot reload
  # -------------------------------------------------
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: >
      sh -c "
        pip install --no-cache-dir --upgrade pip &&
        pip install --no-cache-dir -e '.[dev]' &&
        uvicorn backend.api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir backend --reload-dir frontend
      "
    volumes:
      - .:/app
      - /app/data/db
      - /app/data/images
      - /app/data/models_cache
    ports:
      - "8000:8000"
    environment:
      - DEBUG=true
      - AI_PROVIDER=local
      - DEVICE=cpu
      - DATABASE_URL=sqlite:///data/db/smart_wardrobe.db
      - CORS_ORIGINS=["*"]
    env_file:
      - .env
    profiles:
      - dev

  # -------------------------------------------------
  # Production API service
  # -------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port 8000 --workers 4
    volumes:
      - smart_wardrobe_data:/app/data
    ports:
      - "8000:8000"
    environment:
      - DEBUG=false
      - AI_PROVIDER=${AI_PROVIDER:-local}
      - DEVICE=${DEVICE:-cpu}
      - DATABASE_URL=sqlite:///data/db/smart_wardrobe.db
      - NIM_API_KEY=${NIM_API_KEY}
      - NIM_API_URL=${NIM_API_URL}
      - NIM_MODEL=${NIM_MODEL}
      - PROFILE=prod
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
      - prod

  # -------------------------------------------------
  # Nginx reverse proxy (production only)
  # -------------------------------------------------
  nginx:
    image: nginx:alpine
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend:/app/frontend:ro
      - ./deploy/nginx/smart_wardrobe.container.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    profiles:
      - prod

  # -------------------------------------------------
  # Database backup (optional)
  # -------------------------------------------------
  backup:
    image: alpine:latest
    command: sh -c "apk add --no-cache sqlite3 && while true; do sqlite3 /data/db/smart_wardrobe.db '.backup /backups/smart_wardrobe_$(date +%Y%m%d_%H%M%S).db'; sleep 86400; done"
    volumes:
      - smart_wardrobe_data:/data/db:ro
      - ./backups:/backups
    profiles:
      - backup

volumes:
  smart_wardrobe_data:
    driver: local

networks:
  default:
    name: smart-wardrobe-network