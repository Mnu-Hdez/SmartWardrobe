# Smart Wardrobe - Docker Compose
# Dev and prod profiles with nginx reverse proxy

services:
  # Development profile
  app:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["dev", "prod"]
    environment:
      - API_SERVER_IP=0.0.0.0
      - API_PORT=7000
      - DEVICE=cpu
      - CORS_ORIGINS=["*"]
      - DATABASE_URL=sqlite:////app/data/db/smart_wardrobe.db
      - IMAGES_RAW_DIR=/app/data/images/raw
      - IMAGES_PROCESSED_GARMENTS_DIR=/app/data/images/processed/garments
      - MODELS_CACHE_DIR=/app/data/models_cache
      - AI_PROVIDER=local
      - NIM_API_KEY=
    volumes:
      - app_data:/app/data
    ports:
      - "127.0.0.1:7000:7000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Production profile with nginx
  nginx:
    image: nginx:alpine
    profiles: ["prod"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/static:/usr/share/nginx/html/static:ro
      - ./frontend/templates:/usr/share/nginx/html/templates:ro
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - app_data:/app/data:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  app_data:
    driver: local