<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Wardrobe - Settings</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main class="settings-page">
    <header class="settings-header">
      <h1>Wardrobe Settings</h1>
      <p class="settings-subtitle">Manage your garments and preferences</p>
    </header>

    <section class="garments-section reveal-on-scroll">
      <div class="section-header">
        <h2>Your Garments</h2>
        <button type="button" class="btn btn-primary" id="openAddGarmentModal" aria-haspopup="dialog" aria-label="Add new garment">
          <svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>Add Garment</span>
        </button>
      </div>

      <div class="garments-grid wardrobe-grid" id="garmentsGrid" role="list" aria-label="Garment collection">
        <!-- Garment cards rendered by JS -->
      </div>

      <div class="empty-state" id="emptyState" hidden>
        <svg class="empty-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <h3>No garments yet</h3>
        <p>Start building your wardrobe by adding your first piece.</p>
        <button type="button" class="btn btn-primary" id="emptyAddGarmentBtn" aria-label="Add your first garment">
          <svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>Add Garment</span>
        </button>
      </div>
    </section>
  </main>

  <!-- Add/Edit Garment Modal -->
  <dialog id="addGarmentModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-overlay" aria-hidden="true"></div>
    <div class="modal-content">
      <header class="modal-header">
        <h2 id="modalTitle">Add Garment</h2>
        <button type="button" class="modal-close" id="closeAddGarmentModal" aria-label="Close modal">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </header>

      <form id="addGarmentForm" class="modal-form" novalidate>
        <input type="hidden" name="garmentId" id="garmentId">

        <!-- Image Upload Section -->
        <fieldset class="form-fieldset">
          <legend class="fieldset-legend">Garment Image</legend>
          <div class="image-upload" id="imageUpload">
            <input
              type="file"
              id="garmentImage"
              name="garmentImage"
              accept="image/*"
              capture="environment"
              aria-describedby="imageUploadHint"
              class="file-input"
            >
            <div class="upload-zone" id="uploadZone" role="button" tabindex="0" aria-label="Drag and drop or click to upload garment image">
              <svg class="upload-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
              </svg>
              <p class="upload-text">Drag & drop image here, or click to browse</p>
              <p class="upload-hint" id="imageUploadHint">PNG, JPG, WebP up to 5MB</p>
            </div>
            <div class="image-preview" id="imagePreview" hidden>
              <img id="previewImage" src="" alt="Garment preview" class="preview-img">
              <button type="button" class="preview-remove" id="removeImage" aria-label="Remove image">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
            </div>
          </div>
          <div class="field-error" id="imageError" aria-live="polite" hidden></div>
        </fieldset>

        <!-- Basic Info Fields -->
        <fieldset class="form-fieldset">
          <legend class="fieldset-legend">Basic Information</legend>
          <div class="form-row">
            <div class="form-field">
              <label for="garmentName">Name <span class="required" aria-hidden="true">*</span></label>
              <input
                type="text"
                id="garmentName"
                name="garmentName"
                required
                maxlength="100"
                placeholder="e.g., Black Wool Coat"
                autocomplete="off"
                aria-describedby="nameError"
                class="input"
              >
              <div class="field-error" id="nameError" aria-live="polite" hidden></div>
            </div>
            <div class="form-field">
              <label for="garmentBrand">Brand</label>
              <input
                type="text"
                id="garmentBrand"
                name="garmentBrand"
                maxlength="100"
                placeholder="e.g., Uniqlo"
                autocomplete="off"
                class="input"
              >
            </div>
          </div>
        </fieldset>

        <!-- Type & Season Fields -->
        <fieldset class="form-fieldset">
          <legend class="fieldset-legend">Category</legend>
          <div class="form-row">
            <div class="form-field">
              <label for="garmentType">Type <span class="required" aria-hidden="true">*</span></label>
              <select id="garmentType" name="garmentType" required aria-describedby="typeError" class="select">
                <option value="">Select type</option>
                <option value="top">Top</option>
                <option value="bottom">Bottom</option>
                <option value="dress">Dress</option>
                <option value="outerwear">Outerwear</option>
                <option value="shoes">Shoes</option>
                <option value="accessory">Accessory</option>
              </select>
              <div class="field-error" id="typeError" aria-live="polite" hidden></div>
            </div>
            <div class="form-field">
              <label for="garmentSeason">Season <span class="required" aria-hidden="true">*</span></label>
              <select id="garmentSeason" name="garmentSeason" required aria-describedby="seasonError" class="select">
                <option value="">Select season</option>
                <option value="spring">Spring</option>
                <option value="summer">Summer</option>
                <option value="autumn">Autumn</option>
                <option value="winter">Winter</option>
                <option value="all_season">All Season</option>
              </select>
              <div class="field-error" id="seasonError" aria-live="polite" hidden></div>
            </div>
          </div>
        </fieldset>

        <!-- Size & Material Fields -->
        <fieldset class="form-fieldset">
          <legend class="fieldset-legend">Details</legend>
          <div class="form-row">
            <div class="form-field">
              <label for="garmentSize">Size</label>
              <input
                type="text"
                id="garmentSize"
                name="garmentSize"
                maxlength="20"
                placeholder="e.g., M, 32, 42"
                autocomplete="off"
                list="sizeSuggestions"
                class="input"
              >
              <datalist id="sizeSuggestions">
                <option value="XS"></option>
                <option value="S"></option>
                <option value="M"></option>
                <option value="L"></option>
                <option value="XL"></option>
                <option value="XXL"></option>
                <option value="32"></option>
                <option value="34"></option>
                <option value="36"></option>
                <option value="38"></option>
                <option value="40"></option>
                <option value="42"></option>
                <option value="44"></option>
              </datalist>
            </div>
            <div class="form-field">
              <label for="garmentMaterial">Material</label>
              <input
                type="text"
                id="garmentMaterial"
                name="garmentMaterial"
                maxlength="100"
                placeholder="e.g., 100% Cotton"
                autocomplete="off"
                list="materialSuggestions"
                class="input"
              >
              <datalist id="materialSuggestions">
                <option value="Cotton"></option>
                <option value="Wool"></option>
                <option value="Silk"></option>
                <option value="Linen"></option>
                <option value="Polyester"></option>
                <option value="Denim"></option>
                <option value="Leather"></option>
                <option value="Cashmere"></option>
                <option value="Viscose"></option>
                <option value="Elastane"></option>
              </datalist>
            </div>
          </div>
        </fieldset>

        <!-- Form Actions -->
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="cancelGarmentBtn" data-modal-cancel>Cancel</button>
          <button type="submit" class="btn btn-primary" id="submitGarmentBtn">
            <span class="btn-text">Save Garment</span>
            <span class="btn-loading" hidden>
              <svg class="spinner" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                <circle cx="12" cy="12" r="10" stroke-opacity="0.25"></circle>
                <path d="M12 2a10 10 0 0 1 10 10" stroke-opacity="1"></path>
              </svg>
              <span>Saving...</span>
            </span>
          </button>
        </div>
      </form>
    </div>
  </dialog>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer" role="region" aria-label="Notifications" aria-live="polite"></div>

  <script type="module" src="/static/js/settings.js"></script>
</body>
</html>
