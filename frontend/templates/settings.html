<!-- Add/Edit Garment Modal -->
    <div class="modal hidden" id="addGarmentModal" role="dialog" aria-labelledby="addGarmentTitle" aria-modal="true">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <header class="modal-header">
                <h2 id="addGarmentTitle">Añadir Prenda</h2>
                <button class="modal-close" id="closeAddGarmentModal" aria-label="Cerrar">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </header>
            <div class="modal-body">
                <form id="addGarmentForm" enctype="multipart/form-data" novalidate>
                    <div class="form-group">
                        <label for="garmentImage">Foto de la prenda</label>
                        <div class="image-upload" id="imageUpload">
                            <input type="file" id="garmentImage" name="garmentImage" accept="image/*" capture="environment">
                            <div class="upload-placeholder" id="uploadPlaceholder">
                                <svg class="upload-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                    <polyline points="21 15 16 10 5 21"></polyline>
                                </svg>
                                <p class="upload-text">Arrastra una foto aquí o haz clic</p>
                                <p class="upload-hint">JPG, PNG, WebP • Máx 10MB</p>
                            </div>
                            <div class="image-preview hidden" id="imagePreview">
                                <img id="previewImage" src="" alt="Vista previa">
                                <button type="button" class="remove-image" aria-label="Eliminar imagen">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <line x1="18" y1="6" x2="6" y2="18"></line>
                                        <line x1="6" y1="6" x2="18" y2="18"></line>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="garmentName">Nombre <span class="required" aria-hidden="true">*</span></label>
                            <input type="text" id="garmentName" name="garmentName" placeholder="Ej: Camiseta blanca básica" required aria-required="true">
                        </div>
                        <div class="form-group">
                            <label for="garmentBrand">Marca</label>
                            <input type="text" id="garmentBrand" name="garmentBrand" placeholder="Opcional">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="garmentType">Tipo <span class="required" aria-hidden="true">*</span></label>
                            <select id="garmentType" name="garmentType" required aria-required="true">
                                <option value="">Seleccionar...</option>
                                <option value="top">Top / Camiseta</option>
                                <option value="bottom">Pantalón / Falda</option>
                                <option value="dress">Vestido</option>
                                <option value="outerwear">Abrigo / Chaqueta</option>
                                <option value="shoes">Zapatos</option>
                                <option value="accessory">Accesorio</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="garmentSeason">Temporada <span class="required" aria-hidden="true">*</span></label>
                            <select id="garmentSeason" name="garmentSeason" required aria-required="true">
                                <option value="all_season">Todo el año</option>
                                <option value="spring">Primavera</option>
                                <option value="summer">Verano</option>
                                <option value="autumn">Otoño</option>
                                <option value="winter">Invierno</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="garmentSize">Talla</label>
                            <input type="text" id="garmentSize" name="garmentSize" placeholder="Ej: M, 38, L">
                        </div>
                        <div class="form-group">
                            <label for="garmentMaterial">Material</label>
                            <input type="text" id="garmentMaterial" name="garmentMaterial" placeholder="Ej: Algodón, Lana">
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" data-modal-cancel>Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar Prenda</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>
