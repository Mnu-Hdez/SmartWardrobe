<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Wardrobe</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main id="mainContent"></main>

    <!-- Toast Container (global) -->
    <div class="toast-container" id="toastContainer" role="region" aria-label="Notifications" aria-live="polite"></div>

    <script type="module">
        // SPA Router
        const routes = {
            '/kiosk': {
                template: '/templates/kiosk.html',
                load: () => import('/static/js/kiosk.js')
            },
            '/settings': {
                template: '/templates/settings.html',
                load: () => import('/static/js/settings.js')
            }
        };

        let currentRoute = null;

        async function loadRoute(path) {
            // Normalize path
            const normalizedPath = path === '/' || path === '' ? '/kiosk' : path;
            const route = routes[normalizedPath];

            if (!route) {
                console.warn(`Route not found: ${normalizedPath}, redirecting to /kiosk`);
                window.location.hash = '/kiosk';
                return;
            }

            try {
                // 1. Fetch template HTML
                const response = await fetch(route.template);
                if (!response.ok) throw new Error(`Failed to load template: ${response.status}`);
                const html = await response.text();

                // 2. Inject into main content
                const mainContent = document.getElementById('mainContent');
                mainContent.innerHTML = html;

                // 3. Dynamic import module
                const module = await route.load();

                // 4. Call exported init function
                if (normalizedPath === '/kiosk' && module.initKioskUI) {
                    module.initKioskUI();
                } else if (normalizedPath === '/settings' && module.initSettingsUI) {
                    module.initSettingsUI();
                }

                currentRoute = normalizedPath;
                document.title = `Smart Wardrobe - ${normalizedPath === '/kiosk' ? 'Kiosk' : 'Settings'}`;

            } catch (error) {
                console.error('Route loading error:', error);
                document.getElementById('mainContent').innerHTML = `
                    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100dvh; padding: 20px; text-align: center; color: var(--text-muted);">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom: 16px; opacity: 0.5;">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="15" y1="9" x2="9" y2="15"></line>
                            <line x1="9" y1="9" x2="15" y2="15"></line>
                        </svg>
                        <h2 style="margin-bottom: 8px; color: var(--text-secondary);">Failed to load page</h2>
                        <p>${error.message}</p>
                        <button class="btn btn-primary" onclick="window.location.reload()" style="margin-top: 16px;">Reload</button>
                    </div>
                `;
            }
        }

        // Handle hash changes
        function handleHashChange() {
            const path = window.location.hash.slice(1) || '/';
            loadRoute(path);
        }

        // Initial load
        window.addEventListener('hashchange', handleHashChange);
        handleHashChange();

        // Expose for debugging
        window.loadRoute = loadRoute;
    </script>
</body>
</html>
